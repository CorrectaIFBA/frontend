<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Activation links carry a secret in the path; never leak it as a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Correcta: prática de programação com correção automática." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var theme = 'system';
        try { theme = localStorage.getItem('correcta.theme') || 'system'; } catch (e) {}
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <title>Correcta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
